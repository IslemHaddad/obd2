name: Build Android

on:
  push:
    branches: [main]
    paths: ["android/**", "desktop/obdpro/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Bundle the shared diagnostic core + bleak Android backend
        run: |
          pip install --quiet bleak
          rsync -a --exclude gui --exclude app.py --exclude __pycache__ desktop/obdpro/ android/obdpro/
          B=$(python -c "import bleak,os;print(os.path.dirname(bleak.__file__))")
          mkdir -p android/p4a-recipes
          cp -r "$B/backends/p4android/recipes/bleak" android/p4a-recipes/
          sed -i "s/^version = .*/version = 1.0.${BUILD}/" android/buildozer.spec

      - name: Cache Buildozer global dir (keeps the debug keystore stable so updates install over old)
        uses: actions/cache@v4
        with:
          path: buildozer-home
          key: buildozer-global-v3

      # Official kivy/buildozer image: Android SDK/NDK, python-for-android, Cython and buildozer pre-installed.
      - name: Build APK
        run: |
          mkdir -p buildozer-home
          docker run --rm \
            --user root \
            -e HOME=/home/user \
            -v "$PWD/android":/home/user/hostcwd \
            -v "$PWD/buildozer-home":/home/user/.buildozer \
            kivy/buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/bin/*.apk

  release:
    needs: apk
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Publish stable download link
        run: |
          cp apk/*.apk OBDPro-android.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest OBDPro-android.apk --latest=false \
            --title "OBD Pro for Android (build ${BUILD})" \
            --notes "Install: open this page on the Android phone, download OBDPro-android.apk, allow 'Install unknown apps' when asked, then install. To update, install the new APK over the old one." \
            --target "$GITHUB_SHA"
