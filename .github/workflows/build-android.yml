name: Build Android

on:
  push:
    branches: [main]
    paths: ["android/**", "desktop/obdpro/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer
        run: pip install "buildozer" "cython<3" bleak

      - name: Bundle the shared diagnostic core + bleak Android backend
        run: |
          rsync -a --exclude gui --exclude app.py --exclude __pycache__ desktop/obdpro/ android/obdpro/
          B=$(python -c "import bleak,os;print(os.path.dirname(bleak.__file__))")
          mkdir -p android/p4a-recipes
          cp -r "$B/backends/p4android/recipes/bleak" android/p4a-recipes/
          sed -i "s/^version = .*/version = 1.0.${BUILD}/" android/buildozer.spec

      - name: Cache Buildozer toolchain + debug keystore (keeps the APK signature stable between builds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log | tail -n 200

      - name: Publish (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/bin/*.apk | head -1)
          cp "$APK" OBDPro-android.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest OBDPro-android.apk --latest=false \
            --title "OBD Pro for Android (build ${BUILD})" \
            --notes "Install: open this page on the Android phone, download OBDPro-android.apk, allow 'Install unknown apps' when asked, then install. Updates: install the new APK over the old one." \
            --target "$GITHUB_SHA"

      - name: Publish build errors (readable without login)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Android build ${BUILD} failed at ${GITHUB_SHA}"; echo '```';
            (grep -nE "Error|error:|Exception|FAILED|Traceback" android/build.log | tail -60; echo ----; tail -80 android/build.log) 2>/dev/null;
            echo '```'; } > errors.md
          gh release delete android-ci-errors --yes --cleanup-tag 2>/dev/null || true
          gh release create android-ci-errors --prerelease --latest=false --title "Android CI errors" --notes-file errors.md --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: android/bin/*.apk
